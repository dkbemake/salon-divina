# Configuration Netlify pour Salon Divina.
# Le plugin officiel @netlify/plugin-nextjs (OpenNext) transforme les routes
# API Next.js en Netlify Functions.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
